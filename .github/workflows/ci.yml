name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Cross-compile
        env:
          CGO_ENABLED: 0
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            echo "Building ${GOOS}/${GOARCH}"
            GOOS="$GOOS" GOARCH="$GOARCH" go build -o /dev/null ./cmd/tickwarden
          done

  companion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build companion mod
        working-directory: companion
        run: ./gradlew build --no-daemon
