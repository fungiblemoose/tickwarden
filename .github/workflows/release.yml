name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Go binaries
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            out="dist/tickwarden-${GOOS}-${GOARCH}"
            echo "Building ${out}"
            GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "$out" ./cmd/tickwarden
          done

      - name: Build companion jar
        working-directory: companion
        run: ./gradlew build --no-daemon

      - name: Stage companion jar
        run: |
          # Select only the remapped production jar (no -dev / -sources classifier)
          jar=$(ls companion/build/libs/tickwarden-companion-*.jar | grep -Ev '\-(dev|sources)\.jar$')
          cp "$jar" dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tickwarden-linux-amd64
            dist/tickwarden-linux-arm64
            dist/tickwarden-darwin-arm64
            dist/tickwarden-companion-*.jar
