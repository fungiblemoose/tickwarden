plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'java'
}

version = '0.3.0'
group = 'com.backspinlabs.tickwarden'

base {
    archivesName = 'tickwarden-companion'
}

loom {
    // The /hotspots endpoint enumerates loaded chunks via ChunkMap.getChunks(),
    // which is protected; this widens it to accessible at compile/runtime.
    accessWidenerPath = file('src/main/resources/tickwarden-companion.accesswidener')
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

// Version coordinates live in gradle.properties and default to the target
// server (Minecraft 1.21.5). Override per build, e.g.:
//   ./gradlew build -Pminecraft_version=1.21.4 -Pfabric_api_version=0.119.0+1.21.4
// See docs/MULTIVERSION.md for picking the right fabric-api build.
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraft_version
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_version: minecraft_version
    }
}
