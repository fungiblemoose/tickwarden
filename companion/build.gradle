plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'java'
}

version = '0.2.0'
group = 'com.backspinlabs.tickwarden'

base {
    archivesName = 'tickwarden-companion'
}

loom {
    // The /hotspots endpoint enumerates loaded chunks via ChunkMap.getChunks(),
    // which is protected; this widens it to accessible at compile/runtime.
    accessWidenerPath = file('src/main/resources/tickwarden-companion.accesswidener')
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

// Versions pinned to match the target server (Minecraft 1.21.5).
// fabric-api version copied verbatim from the server's mods/ directory.
dependencies {
    minecraft 'com.mojang:minecraft:1.21.5'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.128.2+1.21.5'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}
